name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  # ---------------------------------------------------------------------------
  # 🔴 Doc 02 §6 rule 7: the smoke suite runs on EVERY migration. It takes under
  # a second and catches trigger regressions that unit tests miss. This job is
  # required for merge — it is not advisory.
  # ---------------------------------------------------------------------------
  schema:
    name: Schema + smoke test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: agricrm
          POSTGRES_USER: agricrm
          POSTGRES_PASSWORD: agricrm_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U agricrm -d agricrm"
          --health-interval 5s --health-timeout 5s --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Apply schema
        env:
          PGPASSWORD: agricrm_ci
        run: |
          psql -h localhost -U agricrm -d agricrm -v ON_ERROR_STOP=1 \
               -c "CREATE EXTENSION IF NOT EXISTS postgis;"
          psql -h localhost -U agricrm -d agricrm -v ON_ERROR_STOP=1 \
               -f agri-crm-docs/sql/schema.sql
          psql -h localhost -U agricrm -d agricrm -v ON_ERROR_STOP=1 \
               -f agri-crm-docs/sql/schema_invoice_advanced.sql
          psql -h localhost -U agricrm -d agricrm -v ON_ERROR_STOP=1 \
               -f agri-crm-docs/sql/schema_identity.sql
          psql -h localhost -U agricrm -d agricrm -v ON_ERROR_STOP=1 \
               -f agri-crm-docs/sql/seed_reference.sql

      - name: Smoke test (20 assertions)
        env:
          PGPASSWORD: agricrm_ci
        run: |
          set -o pipefail
          OUT=$(psql -h localhost -U agricrm -d agricrm -v ON_ERROR_STOP=1 \
                     -f agri-crm-docs/sql/smoke_test.sql 2>&1)
          echo "$OUT"
          PASSES=$(printf '%s\n' "$OUT" | grep -c 'PASS' || true)
          if [ "$PASSES" -ne 20 ]; then
            echo "::error::Expected 20 assertions, saw $PASSES"
            exit 1
          fi
          echo "Smoke test green — $PASSES/20"

  lint:
    name: Lint + format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install ruff==0.16.4
      - run: ruff check backend/
      - run: ruff format --check backend/

  compliance:
    name: Compliance guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 🔴 R6 — campaigns must read comm.v_messageable_farmer, never core.farmer
      - name: "R6: messageable-view enforcement"
        run: bash scripts/check-r6.sh

      # 🔴 Doc 12 §6 — a secret in git history has to be rotated, and the
      # rotation is always discovered late.
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    name: Backend tests
    runs-on: ubuntu-latest
    needs: [schema]
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: agricrm
          POSTGRES_USER: agricrm
          POSTGRES_PASSWORD: agricrm_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U agricrm -d agricrm"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://agricrm:agricrm_ci@localhost:5432/agricrm
      TEST_DATABASE_URL: postgres://agricrm:agricrm_ci@localhost:5432/agricrm
      API_SECRET_KEY: ci-only-not-a-real-secret
      DEBUG: "false"
      DEV_NO_AUTH: "false"
      DEV_NO_MFA: "false"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt

      - name: Apply the schema
        env:
          PGPASSWORD: agricrm_ci
        run: |
          psql -h localhost -U agricrm -d agricrm -v ON_ERROR_STOP=1 -c "CREATE EXTENSION IF NOT EXISTS postgis;"
          psql -h localhost -U agricrm -d agricrm -v ON_ERROR_STOP=1 -f agri-crm-docs/sql/schema.sql
          psql -h localhost -U agricrm -d agricrm -v ON_ERROR_STOP=1 -f agri-crm-docs/sql/schema_invoice_advanced.sql
          psql -h localhost -U agricrm -d agricrm -v ON_ERROR_STOP=1 -f agri-crm-docs/sql/schema_identity.sql
          psql -h localhost -U agricrm -d agricrm -v ON_ERROR_STOP=1 -f agri-crm-docs/sql/seed_reference.sql

      - name: API tests
        run: pytest -q -c backend/pytest.ini backend/tests

  # ---------------------------------------------------------------------------
  # 🔴 INVOICE.md §12.7 — the AI release gate.
  #
  # A separate job from `test` on purpose. When this one goes red the failure
  # names itself: something in the trust boundary or the golden set regressed,
  # and that is a different conversation from a broken query. It runs against
  # the deterministic fake provider, so it needs no key, costs nothing and
  # cannot be skipped for want of credentials — a safety suite that is skipped
  # in CI looks like coverage and is not.
  # ---------------------------------------------------------------------------
  ai-safety:
    name: AI safety + evaluation gate
    runs-on: ubuntu-latest
    env:
      COPILOT_PROVIDER: fake
      GSTIN_LOOKUP_PROVIDER: fake
      EMAIL_PROVIDER: fake
      WHATSAPP_PROVIDER: fake
      API_SECRET_KEY: ci-only-not-a-real-secret
      DEBUG: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt

      # The gate itself: the golden set covers every case the spec names, the
      # release gate fails on a single accepted unsafe request, and every
      # `_unsafe` fixture is refused by the real guard rather than a stub.
      - name: Evaluation gate
        run: pytest -q -c backend/pytest.ini backend/tests/test_evaluation.py

      # 🔴 The structural half. These assert that the copilot *cannot* issue,
      # that a patch cannot name a money field, and that the console has no
      # code path to allocate a number — properties of the code rather than of
      # a model's behaviour, so they hold whatever the provider does.
      - name: Trust-boundary structure
        run: |
          pytest -q -c backend/pytest.ini backend/tests/test_copilot.py             -k "vocabulary or allocate_number or forbidden_field or amount or explanation"

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      # Doc 03 §10: contract drift fails the build. If the committed
      # openapi.yaml no longer matches the generated types, the frontend is
      # compiling against an API that does not exist any more.
      - name: API types match the committed schema
        run: |
          npm run api:types
          git diff --exit-code src/api/schema.d.ts             || { echo "::error::src/api/schema.d.ts is stale. Run 'npm run api:types' and commit."; exit 1; }

      - run: npm run typecheck
      - run: npm run build

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <!-- The theta of Theta Analytics with a sprig growing up its left side. The
       same drawing as components/Brand.tsx, on a ground rather than
       transparent: a favicon is composited against whatever colour the
       browser's tab strip happens to be, and copper on light grey is not
       legible. Inset by 12% so the drawing does not touch the tile edge. -->

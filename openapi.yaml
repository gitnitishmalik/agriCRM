openapi: 3.0.3
info:
  title: AgriCRM API
  version: 1.0.0
  description: Farmer, FPO & Sugar Mill CRM for Theta Analytics
paths:
  /api/v1/auth/login/:
    post:
      operationId: auth_login_create
      description: Returns a token pair plus the user's role, territory and MFA state.
      summary: Log in
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Login'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Login'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Login'
          description: ''
  /api/v1/auth/logout/:
    post:
      operationId: auth_logout_create
      description: Blacklist the refresh token. Access tokens expire on their own
        in 15m.
      summary: Log out
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '205':
          description: Refresh token blacklisted
  /api/v1/auth/me/:
    get:
      operationId: auth_me_retrieve
      description: Current user, role, permissions and territory.
      summary: Current user
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/v1/auth/mfa/enrol/:
    post:
      operationId: auth_mfa_enrol_create
      description: |-
        Begin TOTP enrolment.

        The device is created unconfirmed and stays that way until the user proves
        they can read a code off it, which /mfa/verify/ handles. Returns a QR code
        to scan and the raw secret for anyone entering it by hand.
      summary: Begin MFA enrolment
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MFAEnrolResponse'
          description: ''
  /api/v1/auth/mfa/verify/:
    post:
      operationId: auth_mfa_verify_create
      description: |-
        Verify a TOTP code and re-issue a token pair with mfa_satisfied=true.

        The re-issue matters: without it the client keeps a token whose claim says
        MFA is outstanding, and every protected call keeps failing.
      summary: Verify MFA code
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MFAVerify'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MFAVerify'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MFAVerify'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
          description: ''
        '400':
          description: Invalid or expired code
  /api/v1/auth/password/change/:
    post:
      operationId: auth_password_change_create
      description: Change password and revoke every outstanding session (Doc 12 §13).
      summary: Change password
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChange'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordChange'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordChange'
        required: true
      security:
      - jwtAuth: []
      responses:
        '204':
          description: Changed; all sessions revoked
  /api/v1/auth/refresh/:
    post:
      operationId: auth_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/v1/blocks/:
    get:
      operationId: blocks_list
      summary: List blocks / tehsils, optionally within one district
      parameters:
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - in: query
        name: district
        schema:
          type: integer
        description: Filter to one district id.
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: q
        schema:
          type: string
        description: Match against name or name_local.
      tags:
      - blocks
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBlockList'
          description: ''
  /api/v1/blocks/{id}/:
    get:
      operationId: blocks_retrieve
      summary: Fetch one block by id
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this block / tehsil.
        required: true
      tags:
      - blocks
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Block'
          description: ''
  /api/v1/crops/:
    get:
      operationId: crops_list
      summary: List crops
      parameters:
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: q
        schema:
          type: string
        description: Match against name or code.
      tags:
      - crops
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCropList'
          description: ''
  /api/v1/crops/{id}/:
    get:
      operationId: crops_retrieve
      summary: Fetch one crop by id
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this crop.
        required: true
      tags:
      - crops
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Crop'
          description: ''
  /api/v1/districts/:
    get:
      operationId: districts_list
      summary: List districts, optionally within one state
      parameters:
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: q
        schema:
          type: string
        description: Match against name or name_local.
      - in: query
        name: state
        schema:
          type: integer
        description: Filter to one state id.
      tags:
      - districts
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedDistrictList'
          description: ''
  /api/v1/districts/{id}/:
    get:
      operationId: districts_retrieve
      summary: Fetch one district by id
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this district.
        required: true
      tags:
      - districts
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/District'
          description: ''
  /api/v1/healthz/:
    get:
      operationId: healthz_retrieve
      description: Unauthenticated liveness probe for the ALB.
      summary: Liveness probe
      tags:
      - ops
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: ''
  /api/v1/organisations/:
    get:
      operationId: organisations_list
      description: Soft-deleted rows are excluded unless `include_deleted=true`. An
        unsupported filter is a 400 rather than a silently ignored parameter.
      summary: List organisations
      parameters:
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - in: query
        name: district
        schema:
          type: integer
      - in: query
        name: include_deleted
        schema:
          type: boolean
        description: Include soft-deleted rows. Off by default; nothing is hard-deleted.
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: member_count__gte
        schema:
          type: integer
      - in: query
        name: member_count__lte
        schema:
          type: integer
      - in: query
        name: owner
        schema:
          type: string
        description: Owner's user public_id.
      - in: query
        name: q
        schema:
          type: string
        description: Name, local name, alias, org code, CIN.
      - in: query
        name: quality_tier
        schema:
          type: string
        description: gold | silver | bronze | quarantine
      - in: query
        name: state
        schema:
          type: integer
      - in: query
        name: status
        schema:
          type: string
        description: core.org_status value.
      - in: query
        name: type
        schema:
          type: string
        description: core.org_type value.
      tags:
      - organisations
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedOrganisationListList'
          description: ''
    post:
      operationId: organisations_create
      description: Returns **409** with candidate matches when the name looks like
        an organisation already in the registry for that district. Pass `?force=true`
        to create anyway — the override is recorded on the row.
      summary: Create an organisation
      parameters:
      - in: query
        name: force
        schema:
          type: boolean
        description: Override duplicate blocking.
      tags:
      - organisations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganisationDetail'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OrganisationDetail'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OrganisationDetail'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganisationDetail'
          description: ''
  /api/v1/organisations/{id}/:
    get:
      operationId: organisations_retrieve
      description: Includes the profile implied by the type discriminator. Resolves
        soft-deleted rows too, so a stored id never turns into a 404 that looks like
        the id was wrong.
      summary: Fetch one organisation
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this organisation.
        required: true
      tags:
      - organisations
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganisationDetail'
          description: ''
    put:
      operationId: organisations_update
      summary: Replace an organisation
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this organisation.
        required: true
      tags:
      - organisations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganisationDetail'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OrganisationDetail'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OrganisationDetail'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganisationDetail'
          description: ''
    patch:
      operationId: organisations_partial_update
      summary: Update part of an organisation
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this organisation.
        required: true
      tags:
      - organisations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedOrganisationDetail'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedOrganisationDetail'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedOrganisationDetail'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganisationDetail'
          description: ''
    delete:
      operationId: organisations_destroy
      description: Sets `is_deleted`; the row and its id continue to resolve.
      summary: Soft delete an organisation
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this organisation.
        required: true
      tags:
      - organisations
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/organisations/bulk-assign/:
    post:
      operationId: organisations_bulk_assign_create
      summary: Reassign the owner of many organisations
      tags:
      - organisations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkAssign'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BulkAssign'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BulkAssign'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/organisations/check-duplicates/:
    post:
      operationId: organisations_check_duplicates_create
      description: Live duplicate check for a create form. Same scorer the create
        endpoint and the admin use, so a client can show the warning before the user
        has filled in the rest of the record.
      summary: Check a name for likely duplicates
      parameters:
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - organisations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DuplicateCheck'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DuplicateCheck'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DuplicateCheck'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedDuplicateCandidateList'
          description: ''
  /api/v1/states/:
    get:
      operationId: states_list
      summary: List states and union territories
      parameters:
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: q
        schema:
          type: string
        description: Match against name or name_local.
      tags:
      - states
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedStateList'
          description: ''
  /api/v1/states/{id}/:
    get:
      operationId: states_retrieve
      summary: Fetch one state by id
      parameters:
      - in: path
        name: id
        schema:
          type: integer
          maximum: 32767
          minimum: -32768
        description: A unique value identifying this state / UT.
        required: true
      tags:
      - states
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/State'
          description: ''
  /api/v1/villages/:
    get:
      operationId: villages_list
      description: "\U0001F534 Requires `district`, `block` or `pincode`. `ref.village`
        holds roughly 660,000 rows; an unscoped list of it is a sequential scan answering
        a question nobody asked."
      summary: List villages within a district, block or pincode
      parameters:
      - in: query
        name: block
        schema:
          type: integer
        description: Block id.
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - in: query
        name: district
        schema:
          type: integer
        description: District id.
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: pincode
        schema:
          type: string
        description: Six-digit pincode.
      - in: query
        name: q
        schema:
          type: string
        description: Match against name or name_local.
      tags:
      - villages
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedVillageList'
          description: ''
  /api/v1/villages/{id}/:
    get:
      operationId: villages_retrieve
      summary: Fetch one village by id
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this village.
        required: true
      tags:
      - villages
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Village'
          description: ''
components:
  schemas:
    BlankEnum:
      enum:
      - ''
    Block:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        lgd_code:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
          nullable: true
        name:
          type: string
        name_local:
          type: string
          nullable: true
        district:
          type: integer
        district_name:
          type: string
          readOnly: true
      required:
      - district
      - district_name
      - id
      - name
    BulkAssign:
      type: object
      properties:
        ids:
          type: array
          items:
            type: string
            format: uuid
          maxItems: 500
        owner_user_id:
          type: string
          format: uuid
          nullable: true
      required:
      - ids
      - owner_user_id
    Crop:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        code:
          type: string
        name:
          type: string
        name_local:
          type: string
          nullable: true
        category:
          type: string
          nullable: true
          description: cereal, pulse, oilseed, cash, horticulture, fodder
        default_season:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/DefaultSeasonEnum'
          - $ref: '#/components/schemas/BlankEnum'
          - $ref: '#/components/schemas/NullEnum'
      required:
      - code
      - id
      - name
    DefaultSeasonEnum:
      enum:
      - kharif
      - rabi
      - zaid
      - perennial
      - annual
      type: string
      description: |-
        * `kharif` - Kharif
        * `rabi` - Rabi
        * `zaid` - Zaid
        * `perennial` - Perennial
        * `annual` - Annual
    District:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        lgd_code:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
          nullable: true
        name:
          type: string
        name_local:
          type: string
          nullable: true
        state:
          type: integer
          maximum: 32767
          minimum: -32768
        state_name:
          type: string
          readOnly: true
      required:
      - id
      - name
      - state
      - state_name
    DuplicateCandidate:
      type: object
      description: Doc 11 §3's duplicate response shape.
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        district:
          type: string
          nullable: true
        similarity:
          type: number
          format: double
        matched_on:
          type: array
          items:
            type: string
      required:
      - district
      - id
      - matched_on
      - name
      - similarity
    DuplicateCheck:
      type: object
      properties:
        name:
          type: string
        district:
          type: integer
          nullable: true
        state:
          type: integer
          nullable: true
        exclude_id:
          type: string
          format: uuid
          nullable: true
      required:
      - name
    Health:
      type: object
      properties:
        status:
          type: string
      required:
      - status
    LegalFormEnum:
      enum:
      - producer_company
      - cooperative_society
      - section_8_company
      - private_limited
      - public_limited
      - llp
      - partnership
      - proprietorship
      - trust
      - society
      - statutory_body
      - unregistered
      - unknown
      type: string
      description: |-
        * `producer_company` - Producer company
        * `cooperative_society` - Cooperative society
        * `section_8_company` - Section 8 company
        * `private_limited` - Private limited
        * `public_limited` - Public limited
        * `llp` - LLP
        * `partnership` - Partnership
        * `proprietorship` - Proprietorship
        * `trust` - Trust
        * `society` - Society
        * `statutory_body` - Statutory body
        * `unregistered` - Unregistered
        * `unknown` - Unknown
    Login:
      type: object
      description: "Issues the token pair and reports whether MFA still has to be
        satisfied.\n\n\U0001F534 Doc 12 §1: MFA is mandatory for data_ops, campaign_manager,
        compliance\nand admin. The token is issued either way, but `mfa_satisfied:
        false` means\nthe client must complete /auth/mfa/verify/ before the token
        is accepted by\nany protected endpoint — enforced by IsMFAVerified, not by
        client goodwill."
      properties:
        email:
          type: string
          writeOnly: true
        password:
          type: string
          writeOnly: true
      required:
      - email
      - password
    LogoutRequest:
      type: object
      properties:
        refresh:
          type: string
      required:
      - refresh
    MFAEnrolResponse:
      type: object
      properties:
        provisioning_uri:
          type: string
          description: otpauth:// URI. Contains the shared secret — never log it.
        qr_svg:
          type: string
          description: Inline SVG QR code for the URI above.
        secret:
          type: string
          description: Base32 secret, for manual entry.
        already_confirmed:
          type: boolean
          description: True if this device was already enrolled and confirmed.
      required:
      - already_confirmed
      - provisioning_uri
      - qr_svg
      - secret
    MFAVerify:
      type: object
      properties:
        token:
          type: string
          maxLength: 8
          minLength: 6
      required:
      - token
    NullEnum:
      enum:
      - null
    OrganisationDetail:
      type: object
      description: The full record, including whichever profile the type discriminator

  /api/v1/invoices/{invoice_id}/issue/:
    post:
      tags:
      - billing
      summary: Invoice Issue
      description: "Allocate a number and freeze the document. The point of no return.\n\
        \n\U0001F534 The allocation takes a row lock on the series. Two people issuing\
        \ at the\nsame moment is exactly when a series hands out a duplicate \u2014\
        \ the unique\nindex would then reject the second insert, which is correct\
        \ but arrives as\na 500 rather than as a queue.\n\n\U0001F534 **The pre-issue\
        \ checks run here**, not only on the confirmation screen.\nA client that never\
        \ calls `/checks/`, or calls it and ignores the answer,\nstill cannot issue\
        \ an invoice with a malformed GSTIN or a cancelled\nregistration \u2014 because\
        \ this endpoint runs the same checks itself and\nrefuses on its own findings.\
        \ A control that depends on a UI remembering to\nask is not a control."
      operationId: invoice_issue_api_v1_invoices__invoice_id__issue__post
      security:
      - HTTPBearer: []
      parameters:
      - name: invoice_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Invoice Id
      requestBody:
        content:
          application/json:
            schema:
              anyOf:
              - $ref: '#/components/schemas/IssueRequest'
              - type: 'null'
              title: Payload
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssueResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/invoices/{invoice_id}/cancel/:
    post:
      tags:
      - billing
      summary: Invoice Cancel
      description: "Cancel, keeping the number.\n\n\U0001F534 The number is burned,\
        \ not returned to the series. A reason is required\nhere and by a database\
        \ CHECK, because that is the field left blank\nthroughout the historical data."
      operationId: invoice_cancel_api_v1_invoices__invoice_id__cancel__post
      security:
      - HTTPBearer: []
      parameters:
      - name: invoice_id
        in: path
        required: true

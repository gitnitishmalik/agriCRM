          application/json:
            schema:
              $ref: '#/components/schemas/CancelRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  anyOf:
                  - type: string
                  - type: 'null'
                title: Response Invoice Cancel Api V1 Invoices  Invoice Id  Cancel  Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/invoices/{invoice_id}/payments/:
    post:
      tags:
      - billing
      summary: Invoice Payment
      description: "Record money received.\n\nStatus follows the money \u2014 the\
        \ database trigger moves the invoice to\n`part_paid` or `paid` (smoke test\
        \ 20), so this does not set it. Two places\ndeciding what \"paid\" means is\
        \ how a register stops agreeing with itself."

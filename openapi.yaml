  /api/v1/invoice-ai/evaluations/summary/:
    get:
      tags:
      - compliance
      summary: Ai Evaluation Summary
      description: "Accuracy, abstention, latency and safety for the most recent run.\n\
        \n\U0001F534 `critical_passed` is reported on its own and never folded into\n\
        `pass_rate`. An invoice number and a GSTIN are exactly right or they are\n\
        wrong; averaging them with a dozen softer fields produces a number that\n\
        looks healthy while the two that matter are broken."
      operationId: ai_evaluation_summary_api_v1_invoice_ai_evaluations_summary__get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:

    PreviewLineIn:
      properties:
        line_no:
          anyOf:
          - type: integer
          - type: 'null'
          title: Line No
        description:
          type: string
          title: Description
          default: ''
        hsn_sac:
          anyOf:
          - type: string
          - type: 'null'
          title: Hsn Sac
        quantity:
          anyOf:
          - type: number
          - type: string
            pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          - type: 'null'
          title: Quantity
        unit:
          type: string
          title: Unit
          default: each
        rate:
          anyOf:
          - type: number
          - type: string
            pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          - type: 'null'
          title: Rate
        rate_is_tax_inclusive:
          type: boolean
          title: Rate Is Tax Inclusive
          default: false
        tax_rate_pct:
          anyOf:
          - type: number
          - type: string
            pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          - type: 'null'
          title: Tax Rate Pct
        location_note:
          anyOf:
          - type: string
          - type: 'null'
          title: Location Note
      type: object
      title: PreviewLineIn
      description: "A line as the *preview* receives it \u2014 deliberately lenient.\n\
        \n\U0001F534 Separate from `InvoiceLineIn` on purpose. The live preview fires\
        \ on\nevery keystroke, so a quantity typed before a rate must render the document\n\
        as far as it goes: an unfilled field is not an invalid one, and answering\n\
        400 makes the preview look like a broken renderer.\n\nCreating an invoice\
        \ keeps the strict shape. Nothing rendered here is\nsaved, no number is allocated,\
        \ and `compute_line` reads a missing figure as\nzero \u2014 so the leniency\
        \ buys a working preview and gives up nothing."
    PreviewRequest:
      properties:
        billing_entity:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Billing Entity
        entity_code:
          anyOf:
          - type: string
          - type: 'null'
          title: Entity Code
        invoice_date:
          type: string
          format: date
          title: Invoice Date
        buyer_name:
          type: string
          title: Buyer Name
          default: ''
        buyer_address:
          anyOf:
          - type: string
          - type: 'null'
          title: Buyer Address
        buyer_gstin:
          anyOf:
          - type: string
          - type: 'null'
          title: Buyer Gstin
        buyer_state_code:
          anyOf:
          - type: string
          - type: 'null'
          title: Buyer State Code
        tax_treatment:
          type: string
          title: Tax Treatment
          default: igst
        tax_rate_pct:
          anyOf:
          - type: number
          - type: string
            pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          title: Tax Rate Pct
          default: '18.00'
        lines:
          items:
            $ref: '#/components/schemas/PreviewLineIn'
          type: array
          title: Lines
          default: []
      type: object
      required:
      - invoice_date
      title: PreviewRequest
      description: "An invoice that does not exist yet, rendered as the document it\
        \ would be.\n\n\U0001F534 The entity may be named either way, and that is\
        \ not laziness.\n\nThe create screen holds `entity_code` (\"TEPL\") because\
        \ that is what the\ndropdown binds to; the register holds the row's UUID.\
        \ Requiring only the\nUUID meant the live preview posted `entity_code` and\
        \ got a 400 on every\nkeystroke \u2014 a broken preview that looked like a\
        \ flaky renderer. Accepting\nboth is one `or` here versus a reshape of the\
        \ form's state."

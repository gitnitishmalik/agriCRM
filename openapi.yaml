  /api/v1/readyz/:
    get:
      tags:
      - ops
      summary: Readyz
      description: "Readiness \u2014 liveness plus a database round trip.\n\nSeparate\
        \ from healthz on purpose: a process that is up but cannot reach\nSingapore\
        \ should be taken out of rotation, not restarted."
      operationId: readyz_api_v1_readyz__get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
                title: Response Readyz Api V1 Readyz  Get

      summary: Export Gstr1 Working Paper
      description: "A B2B working sheet with its reconciliation warnings.\n\n\U0001F534\
        \ A working paper for the CA. It is shaped like GSTR-1's B2B table so it\n\
        can be compared with what they file; it has not been validated against the\n\
        portal's schema, no IRN has been obtained, and nothing here has been or\n\

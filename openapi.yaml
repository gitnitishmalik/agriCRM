openapi: 3.1.0
info:
  title: AgriCRM API
  description: Farmer, FPO & Sugar Mill CRM for Theta Analytics
  version: 1.0.0
paths:
  /api/v1/auth/login/:
    post:
      tags:
      - auth
      summary: Login
      description: 'Sign in. Issues a pair either way; a privileged role''s opens
        nothing until

        the second factor is verified.'
      operationId: login_api_v1_auth_login__post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/refresh/:
    post:
      tags:
      - auth
      summary: Refresh
      description: "\U0001F534 Copies the MFA claims forward; it does not mint them.\n\
        \nOtherwise this is the way around the second factor: sign in, ignore the\n\
        MFA screen, refresh once, hold a satisfied token having proved one factor."
      operationId: refresh_api_v1_auth_refresh__post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/me/:
    get:
      tags:
      - auth
      summary: Me
      description: "The caller's own row. Reachable before MFA by design \u2014 the\
        \ client cannot\nknow to redirect to the second-factor screen until it has\
        \ read this."
      operationId: me_api_v1_auth_me__get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserOut'
      security:
      - HTTPBearer: []
  /api/v1/auth/mfa/enrol/:
    post:
      tags:
      - auth
      summary: Mfa Enrol
      description: "Begin TOTP enrolment.\n\nThe device is created unconfirmed and\
        \ stays that way until the user proves\nthey can read a code off it. \U0001F534\
        \ Checking only confirmed devices at verify\ntime made enrolment impossible\
        \ to finish \u2014 nothing else ever flips the\nflag \u2014 which was a real\
        \ bug in the Django service before this migration."
      operationId: mfa_enrol_api_v1_auth_mfa_enrol__post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MFAEnrolResponse'
      security:
      - HTTPBearer: []
  /api/v1/auth/mfa/verify/:
    post:
      tags:
      - auth
      summary: Mfa Verify
      description: 'Verify a code and re-issue the pair with `mfa_satisfied=true`.


        The re-issue matters: without it the client keeps a token whose claim still

        says MFA is outstanding, and every protected call keeps failing.'
      operationId: mfa_verify_api_v1_auth_mfa_verify__post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MFAVerifyRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/v1/auth/logout/:
    post:
      tags:
      - auth
      summary: Logout
      description: 'Blacklist the refresh token. Access tokens expire on their own
        in 15m.


        Idempotent: a double-tapped sign-out button is not an error condition.'
      operationId: logout_api_v1_auth_logout__post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
        required: true
      responses:
        '205':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/v1/auth/password/change/:
    post:
      tags:
      - auth
      summary: Password Change
      description: "Change the password and revoke every outstanding session (Doc\
        \ 12 \xA713).\n\n\U0001F534 Depends on `CurrentUser`, not `AnyUser` \u2014\
        \ deliberately absent from\nPRE_MFA. Someone holding a stolen password and\
        \ nothing else must not be\nable to replace it with one they chose."
      operationId: password_change_api_v1_auth_password_change__post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
        required: true
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/v1/organisations/:
    get:
      tags:
      - organisations
      summary: Organisation List
      description: 'The register.


        Filters are named parameters rather than a free-form query string. FastAPI

        rejects an unknown one with a 422 by default, which preserves the rule the

        Django service enforced by hand: a typo''d filter that silently does

        nothing is how someone exports the whole registry believing they exported

        one district.'
      operationId: organisation_list_api_v1_organisations__get
      security:
      - HTTPBearer: []
      parameters:
      - name: type
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Type
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Status
      - name: state
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          title: State
      - name: district
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          title: District
      - name: quality_tier
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Quality Tier
      - name: owner
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Owner
      - name: member_count__gte
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          title: Member Count  Gte
      - name: member_count__lte
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          title: Member Count  Lte
      - name: q
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Q
      - name: include_deleted
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Include Deleted
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          default: 50
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          default: 0
          title: Offset
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganisationPage'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - organisations
      summary: Organisation Create
      description: "Add an organisation, refusing a likely duplicate.\n\n\U0001F534\
        \ 409 with the candidates attached, rather than a silent create. A\nregister\
        \ that quietly accepts the same FPO twice is a register nobody can\ncount,\
        \ and the second copy is discovered months later by a field agent\nvisiting\
        \ the same people twice."
      operationId: organisation_create_api_v1_organisations__post
      security:
      - HTTPBearer: []
      parameters:
      - name: force
        in: query
        required: false
        schema:
          type: boolean
          description: Create despite duplicates. Recorded.
          default: false
          title: Force
        description: Create despite duplicates. Recorded.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganisationCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganisationDetail'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/organisations/{organisation_id}:
    get:
      tags:
      - organisations
      summary: Organisation Detail
      description: "One organisation.\n\nResolves soft-deleted rows too, so a stored\
        \ id never turns into a 404 that\nlooks like the id was wrong \u2014 the tombstone\
        \ and its state are the answer."
      operationId: organisation_detail_api_v1_organisations__organisation_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: organisation_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Organisation Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganisationDetail'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    patch:
      tags:
      - organisations
      summary: Organisation Update
      operationId: organisation_update_api_v1_organisations__organisation_id__patch
      security:
      - HTTPBearer: []
      parameters:
      - name: organisation_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Organisation Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganisationUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganisationDetail'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    put:
      tags:
      - organisations
      summary: Organisation Replace
      operationId: organisation_replace_api_v1_organisations__organisation_id__put
      security:
      - HTTPBearer: []
      parameters:
      - name: organisation_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Organisation Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganisationUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganisationDetail'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - organisations
      summary: Organisation Delete
      description: "\U0001F534 Soft delete. Nothing in this system is hard-deleted\
        \ (CLAUDE.md).\n\nThe row keeps its id and stays resolvable on the detail\
        \ route, so a stored\nreference does not turn into a 404 that looks like the\
        \ id was wrong."
      operationId: organisation_delete_api_v1_organisations__organisation_id__delete
      security:
      - HTTPBearer: []
      parameters:
      - name: organisation_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Organisation Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/invoices/:
    get:
      tags:
      - billing
      summary: Invoice List
      description: "The register.\n\n\U0001F534 An unknown query parameter is a 400,\
        \ not a shrug. FastAPI ignores\nextras by default; `deps.reject_unknown_filters`\
        \ reinstates the rule the\nDjango service enforced by hand, because a filter\
        \ that silently does\nnothing is how someone exports the whole register believing\
        \ they exported\none customer."
      operationId: invoice_list_api_v1_invoices__get
      security:
      - HTTPBearer: []
      parameters:
      - name: entity_code
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Entity Code
      - name: financial_year
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Financial Year
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Status
      - name: outstanding
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Outstanding
      - name: search
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Search
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          default: 50
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          default: 0
          title: Offset
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoicePage'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - billing
      summary: Invoice Create
      description: Create a draft. A number is allocated at issue, never here.
      operationId: invoice_create_api_v1_invoices__post
      security:
      - HTTPBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvoiceCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceDetail'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/invoices/summary/:
    get:
      tags:
      - billing
      summary: Invoice Summary
      description: "Totals across whatever the register is currently filtered to.\n\
        \n\U0001F534 Cancelled, discarded and draft invoices are excluded from every\
        \ figure.\nThey are documents that exist and are not owed, and counting them\
        \ makes a\nreceivables number meaningless."
      operationId: invoice_summary_api_v1_invoices_summary__get
      security:
      - HTTPBearer: []
      parameters:
      - name: entity_code
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Entity Code
      - name: financial_year
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Financial Year
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterSummary'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/invoices/{invoice_id}/:
    get:
      tags:
      - billing
      summary: Invoice Detail
      operationId: invoice_detail_api_v1_invoices__invoice_id___get
      security:
      - HTTPBearer: []
      parameters:
      - name: invoice_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Invoice Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceDetail'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    patch:
      tags:
      - billing
      summary: Invoice Update
      description: "Edit a draft.\n\n\U0001F534 Only a draft. Once issued the document\
        \ exists in someone else's\naccounts, and changing it there is not an edit\
        \ \u2014 it is a different\ndocument wearing the same number."
      operationId: invoice_update_api_v1_invoices__invoice_id___patch
      security:
      - HTTPBearer: []
      parameters:
      - name: invoice_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Invoice Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvoiceUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceDetail'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    put:
      tags:
      - billing
      summary: Invoice Replace
      description: "Edit a draft.\n\n\U0001F534 Only a draft. Once issued the document\
        \ exists in someone else's\naccounts, and changing it there is not an edit\
        \ \u2014 it is a different\ndocument wearing the same number."
      operationId: invoice_replace_api_v1_invoices__invoice_id___put
      security:
      - HTTPBearer: []
      parameters:
      - name: invoice_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Invoice Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvoiceUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceDetail'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - billing
      summary: Invoice Delete
      description: "\U0001F534 Only a draft. An issued invoice is cancelled, with\
        \ a reason, and keeps\nits number \u2014 a document that exists in someone's\
        \ accounts cannot be made\nnot to have existed."
      operationId: invoice_delete_api_v1_invoices__invoice_id___delete
      security:
      - HTTPBearer: []
      parameters:
      - name: invoice_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Invoice Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/states/:
    get:
      tags:
      - geography
      summary: State List
      description: All 36 states and union territories. Small enough to return whole.
      operationId: state_list_api_v1_states__get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/StateOut'
                type: array
                title: Response State List Api V1 States  Get
      security:
      - HTTPBearer: []
  /api/v1/districts/:
    get:
      tags:
      - geography
      summary: District List
      description: "Districts, optionally within one state.\n\n~780 rows nationally,\
        \ so an unscoped list is allowed here \u2014 unlike\nvillages. The `state`\
        \ filter exists because that is how the UI asks."
      operationId: district_list_api_v1_districts__get
      security:
      - HTTPBearer: []
      parameters:
      - name: state
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          title: State
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DistrictOut'
                title: Response District List Api V1 Districts  Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/blocks/:
    get:
      tags:
      - geography
      summary: Block List
      description: ~7,000 blocks nationally. Scoped by district in practice.
      operationId: block_list_api_v1_blocks__get
      security:
      - HTTPBearer: []
      parameters:
      - name: district
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          title: District
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BlockOut'
                title: Response Block List Api V1 Blocks  Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/villages/:
    get:
      tags:
      - geography
      summary: Village List
      description: "Villages, and only within a scope.\n\n\U0001F534 A district, block\
        \ or pincode is required. `ref.village` reaches ~660k\nrows; refusing is the\
        \ honest answer, and it is a 400 rather than an empty\nlist so the caller\
        \ learns what to send rather than concluding the table is\nempty."
      operationId: village_list_api_v1_villages__get
      security:
      - HTTPBearer: []
      parameters:
      - name: district
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          title: District
      - name: block
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          title: Block
      - name: pincode
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Pincode
      - name: q
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Q
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 500
          default: 200
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/VillageOut'
                title: Response Village List Api V1 Villages  Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/states/{state_id}:
    get:
      tags:
      - geography
      summary: State Detail
      operationId: state_detail_api_v1_states__state_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: state_id
        in: path
        required: true
        schema:
          type: integer
          title: State Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StateOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/districts/{district_id}:
    get:
      tags:
      - geography
      summary: District Detail
      operationId: district_detail_api_v1_districts__district_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: district_id
        in: path
        required: true
        schema:
          type: integer
          title: District Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DistrictOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/blocks/{block_id}:
    get:
      tags:
      - geography
      summary: Block Detail

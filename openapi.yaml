    post:
      tags:
      - invoice-copilot
      summary: Copilot Proposal Confirm
      description: "\U0001F534 A named human accepts exactly these bytes.\n\nIdempotent:\
        \ confirming twice with the same hash is the same as confirming\nonce. Confirming\
        \ with a different hash is refused, because the draft has\nmoved and the diff\
        \ on screen is no longer the diff being approved."
      operationId: copilot_proposal_confirm_api_v1_invoice_copilot_proposals__proposal_id__confirm__post
      security:

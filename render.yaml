# Render blueprint — staging only.
#
# 🔴 Synthetic data only. Render has no India region, and Doc 03 §7 requires
# personal data to stay in ap-south-1. See DEPLOYMENT.md.
#
# The database is deliberately NOT a Render Postgres: the free tier there is
# deleted after 90 days and cannot be placed in India. Point DATABASE_URL at
# Neon or Supabase in ap-south-1 instead.

services:
  - type: web
    name: agricrm-api
    runtime: python
    plan: free
    region: singapore # closest Render offers to India; still not ap-south-1
    rootDir: .
    buildCommand: pip install -r backend/requirements.txt
    startCommand: >-
      uvicorn backend.main:app
      --host 0.0.0.0
      --port $PORT
      --workers 2
    healthCheckPath: /api/v1/healthz
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: API_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false # set to the Neon/Supabase ap-south-1 connection string
      - key: CORS_ALLOWED_ORIGINS
        sync: false # https://<your-project>.vercel.app
      - key: SENTRY_DSN
        sync: false
      - key: DEBUG
        value: "false"
      - key: DEV_NO_AUTH
        value: "false"
      - key: DEV_NO_MFA
        value: "false"

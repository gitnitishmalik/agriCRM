# 🔴 gitleaks is not optional (Doc 12 §6). A secret in git history is a secret
# that has to be rotated, and the rotation is always discovered late.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
        files: ^backend/
      - id: ruff-format
        files: ^backend/

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.0
    hooks:
      - id: gitleaks

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: detect-private-key
      - id: check-yaml
      - id: check-json

  # Local guard for R6 — see scripts/check-r6.sh
  - repo: local
    hooks:
      - id: r6-messageable-view
        name: "R6: campaigns must read comm.v_messageable_farmer"
        entry: scripts/check-r6.sh
        language: script
        pass_filenames: false

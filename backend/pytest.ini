[pytest]
# The FastAPI service's suite. There is no second one — the Django
# service and its pytest-django configuration were retired on
# 30 Aug 2026, and `backend/tests/` is now the whole of it.
testpaths = tests
pythonpath = ..
asyncio_mode = auto
python_files = test_*.py

# Keep the cache out of `backend/`. The directory left there by an earlier run
# is owned by another account and cannot be written or deleted without
# elevation, so every run ended in a wall of PytestCacheWarning. The repo root
# is writable and already gitignored.
cache_dir = ../.pytest_cache
